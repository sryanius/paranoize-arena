<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>투기장 추천 덱</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#ECEEF1; --surface:#FFFFFF; --raised:#F5F7F9;
  --ink:#14171C; --body:#39414B; --muted:#6B7580; --faint:#98A1AB;
  --line:#D6DBE1; --line-soft:#E6EAEF; --accent:#7A3E9D; --up:#2F8F57;
  --fire:#C9502E; --water:#2F6FB3; --earth:#4F8A3C;
  --shadow:0 1px 2px rgba(20,23,28,.06),0 4px 14px rgba(20,23,28,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0E1115; --surface:#171B22; --raised:#1E242C;
  --ink:#EDF0F4; --body:#C2CAD3; --muted:#8B95A0; --faint:#69737E;
  --line:#2A313A; --line-soft:#222831; --accent:#C58FE6; --up:#5FC48A;
  --fire:#F07A55; --water:#6FA6E6; --earth:#7FC06A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--body);font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:960px;margin:0 auto;padding:0 16px 80px}
header{padding:28px 0 20px;border-bottom:1px solid var(--line)}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.16em;color:var(--faint);margin:0 0 8px}
h1{font-family:"Gowun Batang",Georgia,serif;font-weight:700;font-size:clamp(24px,5vw,38px);line-height:1.18;color:var(--ink);margin:0 0 10px;letter-spacing:-.01em;text-wrap:balance}
h2{font-family:"Gowun Batang",Georgia,serif;font-size:19px;color:var(--ink);margin:34px 0 10px}
.lede{margin:0;max-width:64ch;color:var(--muted);font-size:14px}
.pick{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 0}
.pick button{font:inherit;font-size:13px;padding:6px 12px;border:1px solid var(--line);border-radius:99px;background:var(--surface);color:var(--muted);cursor:pointer}
.pick button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.wins{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:20px}
.win{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.win .k{font-size:13px;color:var(--muted);margin:0 0 4px}
.win .v{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.win .v s{color:var(--faint);text-decoration:none;font-size:15px}
.win .v b{font-size:30px;color:var(--ink);font-weight:600;line-height:1.1}
.win .v i{font-style:normal;font-size:13px;font-weight:600;color:var(--up)}
.win .v i.down{color:var(--fire)}
.bar{height:6px;background:var(--line-soft);border-radius:99px;overflow:hidden;margin-top:10px;position:relative}
.bar span{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.bar .c{background:var(--faint);opacity:.55}.bar .p{background:var(--accent);height:3px;top:auto}
.plt{display:grid;gap:8px}
.plt-row{display:grid;grid-template-columns:40px repeat(6,minmax(0,1fr));gap:6px;align-items:stretch}
.plt-row>b{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--faint);align-self:center}
.card{position:relative;display:block;border:2px solid var(--line);border-radius:8px;overflow:hidden;background:var(--raised);aspect-ratio:3/4.2;min-width:0}
.card img{display:block;position:absolute;width:150%;height:auto;left:-25%;top:-3%}
.card .rar{position:absolute;left:0;top:0;padding:1px 6px 1px 4px;font:700 10px "IBM Plex Mono",monospace;color:#fff;background:#6b7280;border-radius:0 0 7px 0}
.card.SSR{border-color:#d4a83a}.card.SSR .rar{background:linear-gradient(90deg,#c48f1c,#f0c65a);color:#2a1d00}
.card.SR{border-color:#9b6be0}.card.SR .rar{background:linear-gradient(90deg,#7b47c9,#b48cf2)}
.card.R{border-color:#4f8ad6}.card.R .rar{background:linear-gradient(90deg,#3a6fc0,#78a8ee)}
.card .el{position:absolute;right:3px;top:3px;width:12px;height:12px;border-radius:50%;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.card.Fire .el{background:var(--fire)}.card.Water .el{background:var(--water)}.card.Earth .el{background:var(--earth)}
.card .st{position:absolute;left:0;right:0;bottom:19px;text-align:center;font-size:9px;line-height:1;color:#ffd75e;text-shadow:0 0 2px #000,0 1px 1px #000;letter-spacing:-.5px}
.card .lv{position:absolute;left:0;right:0;bottom:0;padding:2px 3px;background:rgba(0,0,0,.72);color:#fff;font:600 10.5px "IBM Plex Mono",monospace;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .n{position:absolute;left:0;right:0;top:16px;padding:1px 3px;font-size:10px;font-weight:600;color:#fff;text-shadow:0 0 3px #000,0 1px 2px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.moved{outline:2px solid var(--accent);outline-offset:1px}
.card.moved .lv{background:var(--accent)}
.note{border-left:3px solid var(--accent);padding:10px 14px;background:var(--surface);border-radius:0 10px 10px 0;font-size:13px;margin-top:12px;color:var(--muted)}
.note ul{margin:0;padding-left:18px}
.legend{font-size:12px;color:var(--faint);margin:8px 0 0}
footer{margin-top:40px;font-size:12px;color:var(--faint)}
@media (max-width:640px){.plt-row{grid-template-columns:repeat(3,minmax(0,1fr))}.plt-row>b{grid-column:1/-1}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">PARANOIZE · 투기장</p>
    <h1 id="h1">투기장 추천 덱</h1>
    <p class="lede" id="lede">자료 읽는 중…</p>
    <div class="pick" id="pick"></div>
  </header>
  <section class="wins" id="wins"></section>

  <h2 id="pro-h">추천 덱</h2>
  <div class="plt" id="pro"></div>
  <p class="legend" id="legend"></p>

  <h2 id="cur-h">지금 덱</h2>
  <div class="plt" id="cur"></div>

  <h2 id="opp-h">상대 덱</h2>
  <div class="plt" id="opp"></div>

  <h2>읽기 전에</h2>
  <div class="note"><ul id="notes"></ul></div>
  <footer>패러노이즈 자료실의 전투 시뮬레이터로 계산했습니다. 시뮬레이터는 실제 투기장·유적 기록 70판을 한 판도 틀리지 않고 재현합니다(2026-10-29 앱 1.3.0 기준).</footer>
</div>
<script>
const IMG = 'https://peilvwrqgauwlaqojttq.supabase.co/storage/v1/object/public/para-data/char/';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pct = (x) => (100 * x).toFixed(1) + '%';
// 그림이 없는 변형(SR·AltSR 등)은 기본형 그림 → 같은 계열 그림 순으로 빌린다
function alts(u) { const k = u.t, a = []; if (/AltSR$/.test(k)) a.push(k.replace(/AltSR$/, 'AltR'), k.replace(/AltSR$/, 'R')); if (/SR$/.test(k)) a.push(k.replace(/SR$/, '')); if (/SR\d$/.test(k)) a.push(k.replace(/SR\d$/, 'R')); return [...new Set([...a, ...(u.alt || [])])].filter((x) => x !== k); }
window.imgErr = (img) => { const a = (img.dataset.alt || '').split(',').filter(Boolean); if (a.length) { img.dataset.alt = a.slice(1).join(','); img.src = IMG + a[0] + '.jpg'; } else img.style.visibility = 'hidden'; };
const card = (u, moved = '') => `<div class="card ${u.r} ${u.e} ${moved ? 'moved' : ''}" title="${esc(u.n)} · ${u.r} · Lv${u.lv}">
  <img src="${IMG}${u.t}.jpg" alt="" loading="lazy" data-alt="${alts(u).join(',')}" onerror="imgErr(this)">
  <span class="rar">${u.r}</span><span class="el"></span><span class="n">${esc(u.n)}</span>
  ${u.s ? `<span class="st">${'★'.repeat(u.s)}</span>` : ''}<span class="lv">Lv.${u.lv}${moved}</span></div>`;
const rows = (cells) => [0, 1, 2, 3].map((p) => `<div class="plt-row"><b>${p + 1}반</b>${cells.slice(p * 6, p * 6 + 6).join('')}</div>`).join('');

let ALL, X;
async function boot() {
  try { ALL = (await (await fetch('data.json', { cache: 'no-cache' })).json()).entries; }
  catch { $('lede').textContent = '자료를 못 읽었습니다.'; return; }
  const want = new URLSearchParams(location.search).get('id');
  $('pick').innerHTML = ALL.length > 1 ? ALL.map((e, i) => `<button data-i="${i}">${esc(e.me.name)} → ${esc(e.opp.name)}</button>`).join('') : '';
  for (const b of $('pick').querySelectorAll('button')) b.onclick = () => show(+b.dataset.i, true);
  show(Math.max(0, ALL.findIndex((e) => e.id === want)), false);
}
function show(i, push) {
  X = ALL[i];
  if (push) history.replaceState(null, '', '?id=' + encodeURIComponent(X.id));
  for (const b of $('pick').querySelectorAll('button')) b.classList.toggle('on', +b.dataset.i === i);
  document.title = `${X.me.name} → ${X.opp.name} 투기장 추천 덱`;
  $('h1').textContent = `${X.me.name} → ${X.opp.name} 추천 덱`;
  $('lede').textContent = `랭킹에서 읽은 ${X.opp.name} 님의 덱(${X.read}) 상대로, ${X.me.name} 님의 지금 24명을 그대로 두고 자리만 바꾼 순서입니다. 캐릭터를 새로 넣거나 빼지 않습니다.`;
  $('wins').innerHTML = X.matches.slice().sort((a, b) => b.atk - a.atk).map((m) => {
    const d = m.proposed - m.current;
    return `<div class="win"><p class="k">${m.atk ? `${esc(X.opp.name)} 님을 공격할 때` : `${esc(X.opp.name)} 님이 공격해 올 때`}</p>
      <div class="v"><s>${pct(m.current)} →</s><b>${pct(m.proposed)}</b><i class="${d < 0 ? 'down' : ''}">${d >= 0 ? '+' : ''}${(100 * d).toFixed(1)}%p</i></div>
      <div class="bar"><span class="c" style="width:${100 * m.current}%"></span><span class="p" style="width:${100 * m.proposed}%"></span></div></div>`;
  }).join('');
  $('opp-h').textContent = `${X.opp.name} 님 덱 (통솔 ${X.opp.rank})`;
  $('opp').innerHTML = rows(X.opp.deck.map((u) => card(u)));
  $('notes').innerHTML = [
    `승률은 각 ${X.seeds.toLocaleString()}판 시뮬레이션 결과입니다(게임과 같은 무작위 규칙).`,
    `${esc(X.opp.name)} 님이 덱 순서를 바꾸면 결과가 달라집니다. 이 덱은 ${X.read}에 랭킹에서 읽은 순서 기준입니다.`,
    `투귀공명·캠퍼스 보너스는 랭킹에 안 나와서 두 분이 나온 가장 최근 투기장 기록의 값을 썼습니다(그 뒤로 올랐다면 조금 다를 수 있습니다). 통솔은 ${esc(X.me.name)} ${X.me.rank} · ${esc(X.opp.name)} ${X.opp.rank}.`,
    `이 순서는 ${esc(X.opp.name)} 님 상대로만 계산했습니다. 투기장 덱과 유적 덱은 같은 페이지를 쓰니, 다른 상대나 유적에서는 지금 덱이 나을 수 있습니다.`,
    `같은 덱끼리라도 공격과 방어 승률이 다릅니다 — 공격하는 쪽이 자리마다 조금 먼저 들어와 먼저 행동하기 때문입니다. 그게 유리한지는 덱마다 다릅니다.`,
  ].map((t) => `<li>${t}</li>`).join('');
  $('pro-h').textContent = `${X.me.name} 님 추천 덱`;
  $('pro').innerHTML = rows(X.proposed.map((t, pos) => { const was = X.current.indexOf(t); return card(X.units[t], was !== pos ? ` ←${Math.floor(was / 6) + 1}-${was % 6 + 1}` : ''); }));
  const n = X.proposed.filter((t, pos) => X.current.indexOf(t) !== pos).length;
  $('legend').textContent = `보라 테두리 = 자리가 바뀐 캐릭터 ${n}명 · «←2-3» = 지금 덱에서 2반 3번째에 있던 캐릭터`;
  $('cur-h').textContent = `${X.me.name} 님 지금 덱 (통솔 ${X.me.rank})`;
  $('cur').innerHTML = rows(X.current.map((t) => card(X.units[t])));
}
boot();
</script>
</body>
</html>
